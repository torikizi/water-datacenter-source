function render(){const q=DATA.rounds[selected],row=rowFor(q.day),next=rowFor(q.day+1),municipality=q.events.find(e=>e.role.role==='municipality');document.getElementById('rounds').innerHTML=DATA.rounds.map((item,i)=>`<button class="round" aria-pressed="${i===selected}" data-i="${i}"><b>ROUND ${item.round} · D${item.day}</b><span>${esc(reasons[item.reason]||item.reason)}</span></button>`).join('');document.querySelectorAll('.round').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});const action=municipality?.parsed_response.action||'—';document.getElementById('decisionLabel').textContent=`ROUND ${q.round} / DAY ${q.day} · ${q.date}`;document.getElementById('decisionAction').textContent=action;document.getElementById('decisionReason').textContent=reasons[q.reason]||q.reason;const before=row?.restriction??1,after=row?.nextRestriction??before;document.getElementById('effectLabel').textContent=`DAY ${q.day+1} PYTHON EFFECT`;document.getElementById('effectValue').textContent=`DC上水供給上限 ${(before*100).toFixed(0)}% → ${(after*100).toFixed(0)}%`;document.getElementById('effectDetail').textContent=next?`翌日: 貯水率 ${next.storagePct.toFixed(1)}% / DC取水 ${fmt(next.dcWithdrawalL)} / DC不足 ${fmt(next.dcShortageL)}`:'期間末のため翌日データなし';document.getElementById('cards').innerHTML=q.events.map(e=>{const [label,accent,mono]=roles[e.role.role]||[e.role.label_ja,'#64748b','AI'],p=e.parsed_response,u=e.provider_metadata?.usage?.total_tokens??'—',phase=e.role.decision_phase==='policy_resolution'||e.role.role==='municipality'?'POLICY RESOLUTION':'STAKEHOLDER INPUT';return `<article class="agent-card" style="--accent:${accent}"><header><span class="avatar">${mono}</span><div><p class="role-id">${phase} · ${esc(e.role.role)}</p><h2>${esc(label)}</h2></div><span class="valid ${e.valid?'':'ng'}">${e.valid?'JSON VALID':'FALLBACK'}</span></header><div class="action">${esc(p.action)}</div><p class="message">${esc(p.message)}</p><div class="reason"><b>REASON</b>${esc(p.reason)}</div><div class="metrics"><span>${u} tokens</span>${row?`<span>貯水率 <b>${row.storagePct.toFixed(1)}%</b></span>`:''}</div></article>`}).join('');drawChart();}
new ResizeObserver(drawChart).observe(document.getElementById('chart'));render();
</script></body></html>
