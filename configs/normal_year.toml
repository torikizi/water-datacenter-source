# This file intentionally mirrors no real municipality. All quantities are assumptions.
[simulation]
name = "synthetic_normal_year"
start_date = "2026-01-01"
days = 365
seed = 104729

[community]
population = 100_000
per_capita_potable_demand_l_per_day = 250.0

[reservoir]
initial_storage_l = 900_000_000.0
storage_capacity_l = 1_000_000_000.0

[source]
source_l_per_day = 25_000_000.0
monthly_source_multipliers = [0.90, 0.85, 1.00, 1.10, 1.15, 1.10, 1.00, 0.90, 0.85, 0.90, 0.95, 0.90]
scenario_multiplier = 1.0

[allocation]
policy = "resident_first"

[comparison]
drought_source_multiplier = 0.55
reclaimed_water_shares = [0.0, 0.02, 0.25, 0.50]

[agents]
enabled = true
action_effects_enabled = true
restriction_trigger_storage_fraction = 0.25
lift_trigger_storage_fraction = 0.55
restriction_multiplier = 0.75
history_limit = 8

[[datacenters.facilities]]
name = "synthetic_facility_1"
start_day = 60
it_load_mw = 30.0
utilization = 0.80
wue_l_per_kwh = 1.20
potable_water_share = 1.0
reclaimed_water_share = 0.0
evaporation_share = 0.70
blowdown_share = 0.20
regional_return_share = 0.05
recoverable_wastewater_share = 0.05

[[datacenters.facilities]]
name = "synthetic_facility_2"
start_day = 120
it_load_mw = 25.0
utilization = 0.75
wue_l_per_kwh = 1.10
potable_water_share = 1.0
reclaimed_water_share = 0.0
evaporation_share = 0.68
blowdown_share = 0.22
regional_return_share = 0.05
recoverable_wastewater_share = 0.05
